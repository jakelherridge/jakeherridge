# XcodeGen spec. Run `xcodegen generate` in this folder to produce
# SurferPetesEye.xcodeproj (the project file is gitignored on purpose).
name: SurferPetesEye

options:
  bundleIdPrefix: com.jakeherridge
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    MARKETING_VERSION: 0.1.0
    CURRENT_PROJECT_VERSION: 1
    # Set your team here or in Xcode > Signing & Capabilities.
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic

targets:
  SurferPetesEye:
    type: application
    platform: iOS
    sources:
      - path: SurferPetesEye
        excludes:
          - "**/*.md"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jakeherridge.surferpeteseye
        PRODUCT_NAME: SurferPetesEye
        SWIFT_OBJC_BRIDGING_HEADER: SurferPetesEye/Rendering/BridgingHeader.h
        TARGETED_DEVICE_FAMILY: "1"
        MTL_ENABLE_DEBUG_INFO: INCLUDE_SOURCE
        MTL_FAST_MATH: YES
        # Info.plist is generated from these keys. No plist file to maintain.
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: "Pete's Eye"
        INFOPLIST_KEY_NSCameraUsageDescription: "Pete needs to borrow your eyes, brah. Everything stays on the phone."
        INFOPLIST_KEY_NSPhotoLibraryAddUsageDescription: "So Pete can keep the frames you snap."
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UIStatusBarHidden: YES
        INFOPLIST_KEY_UIViewControllerBasedStatusBarAppearance: NO
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES

  SurferPetesEyeTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: SurferPetesEyeTests
    dependencies:
      - target: SurferPetesEye
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jakeherridge.surferpeteseye.tests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  SurferPetesEye:
    build:
      targets:
        SurferPetesEye: all
        SurferPetesEyeTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - SurferPetesEyeTests
    profile:
      config: Release
    archive:
      config: Release
